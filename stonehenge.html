
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Stonehenge Model</title>
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #1a202c; /* Dark blue-gray background */
            color: #e2e8f0;
            overflow: hidden; /* Prevent scrollbars */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: rgba(26, 32, 44, 0.8);
            padding: 20px;
            border-radius: 12px;
            max-width: 350px;
            border: 1px solid #4a5568;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #a0aec0;
        }
        p {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #cbd5e0;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(26, 32, 44, 0.8);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #4a5568;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        button {
            background-color: #4a5568;
            color: #e2e8f0;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #718096;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="info-panel">
        <h1>Stonehenge 3D Model</h1>
        <p>This is an interactive, to-scale representation based on archaeological data. Drag to rotate, right-click/two-finger drag to pan, and scroll to zoom.</p>
    </div>

    <div id="controls">
        <button id="solstice-btn">Simulate Summer Solstice Sunrise</button>
    </div>

    <!-- Three.js library -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a202c);
        scene.fog = new THREE.Fog(0x1a202c, 100, 400);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(50, 30, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- CONTROLS ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 10;
        controls.maxDistance = 200;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent camera from going under the ground
        controls.target.set(0, 5, 0);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x667eea, 0.8); // Soft ambient light
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0); // Start with sun off
        sunLight.position.set(0, 0, 0); // Will be updated by simulation
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 500;
        sunLight.shadow.camera.left = -100;
        sunLight.shadow.camera.right = 100;
        sunLight.shadow.camera.top = 100;
        sunLight.shadow.camera.bottom = -100;
        scene.add(sunLight);
        
        // Sun visual representation
        const sunSphere = new THREE.Mesh(
            new THREE.SphereGeometry(10, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0xffddaa, fog: false })
        );
        sunSphere.visible = false;
        scene.add(sunSphere);


        // --- GROUND ---
        const groundGeometry = new THREE.CircleGeometry(200, 64);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x2d3748, roughness: 0.9, metalness: 0.1 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- STONE CREATION HELPERS ---
        const stoneMaterial = new THREE.MeshStandardMaterial({
            color: 0x878d9c,
            roughness: 0.85,
            metalness: 0.2
        });

        // Function to create a more natural, rough stone shape
        function createStoneGeometry(width, height, depth) {
            const geom = new THREE.BoxGeometry(width, height, depth, 4, 8, 4);
            const positionAttribute = geom.getAttribute('position');
            for (let i = 0; i < positionAttribute.count; i++) {
                const x = positionAttribute.getX(i);
                const y = positionAttribute.getY(i);
                const z = positionAttribute.getZ(i);
                
                // Don't displace the bottom vertices
                if (y > -height / 2 + 0.1) {
                    const displacement = Math.random() * 0.1;
                    positionAttribute.setXYZ(i, x + (Math.random() - 0.5) * displacement * width, y, z + (Math.random() - 0.5) * displacement * depth);
                }
            }
            geom.computeVertexNormals();
            return geom;
        }

        function createStone(width, height, depth, x, y, z, rotationY = 0) {
            const geometry = createStoneGeometry(width, height, depth);
            const stone = new THREE.Mesh(geometry, stoneMaterial);
            stone.position.set(x, y, z);
            stone.rotation.y = rotationY;
            stone.castShadow = true;
            stone.receiveShadow = true;
            scene.add(stone);
            return stone;
        }

        // --- BUILD STONEHENGE ---
        // Data from the provided document
        const sarsenCircleRadius = 16.5; // 33m diameter / 2
        const numSarsenUprights = 30;

        // 1. Outer Sarsen Circle
        for (let i = 0; i < numSarsenUprights; i++) {
            const angle = (i / numSarsenUprights) * Math.PI * 2;
            const x = Math.sin(angle) * sarsenCircleRadius;
            const z = Math.cos(angle) * sarsenCircleRadius;

            // Uprights
            const uprightHeight = 4.1;
            createStone(2.1, uprightHeight, 1.1, x, uprightHeight / 2, z, -angle);

            // Lintels
            const lintelAngle = ((i + 0.5) / numSarsenUprights) * Math.PI * 2;
            const lintelX = Math.sin(lintelAngle) * sarsenCircleRadius;
            const lintelZ = Math.cos(lintelAngle) * sarsenCircleRadius;
            createStone(3.2, 0.8, 1, lintelX, uprightHeight + 0.8 / 2, lintelZ, -lintelAngle);
        }

        // 2. Inner Trilithon Horseshoe
        const trilithonPositions = [
            // Great Trilithon (tallest)
            { x: 0, z: -7.5, h: 7.3, angle: 0 },
            // Medium pair
            { x: 6.5, z: -3, h: 6.7, angle: -Math.PI / 3 },
            { x: -6.5, z: -3, h: 6.7, angle: Math.PI / 3 },
            // Smallest pair
            { x: 6, z: 4, h: 6.1, angle: -Math.PI / 1.5 },
            { x: -6, z: 4, h: 6.1, angle: Math.PI / 1.5 },
        ];
        trilithonPositions.forEach(p => {
            const uprightWidth = 2.5;
            const uprightDepth = 1.2;
            const lintelLength = 4.5;

            // Create a pair of uprights for each trilithon
            const upright1X = p.x + Math.cos(p.angle) * (lintelLength / 2 - uprightWidth / 2);
            const upright1Z = p.z + Math.sin(p.angle) * (lintelLength / 2 - uprightWidth / 2);
            createStone(uprightWidth, p.h, uprightDepth, upright1X, p.h / 2, upright1Z, p.angle);

            const upright2X = p.x - Math.cos(p.angle) * (lintelLength / 2 - uprightWidth / 2);
            const upright2Z = p.z - Math.sin(p.angle) * (lintelLength / 2 - uprightWidth / 2);
            createStone(uprightWidth, p.h, uprightDepth, upright2X, p.h / 2, upright2Z, p.angle);

            // Add the lintel on top
            createStone(lintelLength, 1.2, 1.5, p.x, p.h + 1.2 / 2, p.z, p.angle);
        });

        // 3. Bluestone Arrangements
        const bluestoneCircleRadius = 23.5 / 2;
        const numBluestones = 40; // Approximate for visual representation
        for (let i = 0; i < numBluestones; i++) {
            const angle = (i / numBluestones) * Math.PI * 2;
            const x = Math.sin(angle) * bluestoneCircleRadius;
            const z = Math.cos(angle) * bluestoneCircleRadius;
            const height = 2 + Math.random() * 2; // 2-4m high
            createStone(0.7, height, 0.7, x, height / 2, z);
        }

        // Bluestone Horseshoe (simplified representation)
        const bluestoneHorseshoeRadius = 8;
        const numHorseshoeBluestones = 19;
        for (let i = 0; i < numHorseshoeBluestones; i++) {
            const angle = (i / (numHorseshoeBluestones -1) - 0.5) * 1.5 * Math.PI;
             if (Math.abs(angle) > Math.PI * 0.6) continue; // create horseshoe shape
            const x = Math.sin(angle) * bluestoneHorseshoeRadius;
            const z = -Math.cos(angle) * bluestoneHorseshoeRadius;
            const height = 3 + Math.random();
            createStone(0.8, height, 0.8, x, height / 2, z, -angle);
        }

        // 4. Other Significant Stones
        // Heel Stone
        const heelStoneAngle = 49.6 * (Math.PI / 180);
        const heelStoneDist = 77;
        createStone(2.5, 4.9, 1.5, Math.sin(heelStoneAngle) * heelStoneDist, 4.9 / 2, Math.cos(heelStoneAngle) * heelStoneDist);

        // Altar Stone (fallen)
        const altarStone = createStone(4.9, 1, 1.5, 0, 0.5, -9);
        altarStone.rotation.x = Math.PI / 2;

        // Slaughter Stone (fallen)
        const slaughterStone = createStone(6.4, 1.5, 2.5, 10, 0.75, 20);
        slaughterStone.rotation.z = Math.PI / 2.2;


        // --- ANIMATION & INTERACTIVITY ---
        let simulationTime = 0;
        let isSimulating = false;
        const solsticeBtn = document.getElementById('solstice-btn');

        solsticeBtn.addEventListener('click', () => {
            isSimulating = true;
            simulationTime = 0;
            sunSphere.visible = true;
            solsticeBtn.disabled = true;
            solsticeBtn.textContent = "Simulating...";
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            if (isSimulating) {
                simulationTime += 0.005;
                const sunriseAngle = 50.9 * (Math.PI / 180); // Summer solstice sunrise bearing
                
                // Animate sun path
                const sunDist = 250;
                const sunX = Math.sin(sunriseAngle) * sunDist;
                const sunZ = Math.cos(sunriseAngle) * sunDist;
                
                const sunHeight = Math.sin(simulationTime * Math.PI) * 80; // Peak height of 80
                
                if (sunHeight < -1) { // End of simulation
                    isSimulating = false;
                    sunLight.intensity = 0;
                    sunSphere.visible = false;
                    solsticeBtn.disabled = false;
                    solsticeBtn.textContent = "Simulate Summer Solstice Sunrise";
                } else {
                    sunLight.position.set(sunX, sunHeight, sunZ);
                    sunSphere.position.copy(sunLight.position);
                    sunLight.intensity = Math.max(0, sunHeight / 40); // Intensity based on height
                }
            }

            renderer.render(scene, camera);
        }

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, false);

        animate();
    </script>
</body>
</html>
