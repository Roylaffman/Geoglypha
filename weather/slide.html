<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap');
      
      body {
        margin: 0;
        padding: 0;
        font-family: 'SF Pro Display', sans-serif;
        color: #3C3C3C;
      }
      
      .weather-nav {
        position: sticky;
        top: 0;
        background-color: #3a6351;
        padding: 0.75rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 1.5rem;
        z-index: 100;
        flex-wrap: wrap;
      }

      .weather-nav a {
        color: #f5f5f5;
        text-decoration: none;
        font-family: 'SF Pro Display', sans-serif;
        font-size: 14px;
        font-weight: 500;
        transition: color 0.3s;
      }

      .weather-nav a:hover {
        color: #f2edd7;
      }

      .weather-nav .nav-brand {
        font-weight: 700;
        font-size: 16px;
        margin-right: auto;
      }

      .slide-container {
        width: 100%;
        max-width: 1280px;
        min-height: 720px;
        margin: 0 auto;
        background: #FFFFFF;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 40px;
        box-sizing: border-box;
      }

      @media (max-width: 900px) {
        .slide-container {
          padding: 20px;
          min-height: auto;
        }
        .title {
          font-size: 40px;
        }
        .subtitle {
          font-size: 24px;
        }
      }
      
      .title {
        font-family: 'Inter', sans-serif;
        font-size: 72px;
        font-weight: 700;
        color: #111111;
        margin-bottom: 20px;
        text-align: center;
      }
      
      .subtitle {
        font-family: 'SF Pro Display', sans-serif;
        font-size: 36px;
        font-weight: 400;
        color: #3C3C3C;
        margin-bottom: 40px;
        text-align: center;
      }
      
      .date {
        font-family: 'SF Pro Display', sans-serif;
        font-size: 24px;
        font-weight: 400;
        color: #3C3C3C;
        text-align: center;
      }
      
      .weather-icon {
        font-size: 64px;
        margin-bottom: 30px;
        color: #FF9A73;
      }
    </style>
  </head>
  <body>
    <nav class="weather-nav">
      <a href="https://www.geoglypha1.org" class="nav-brand">Geoglypha</a>
      <a href="index.html">Overview</a>
      <a href="temperature_chart.html">Temperature</a>
      <a href="precipitation_chart.html">Precipitation</a>
      <a href="wind_speed_chart.html">Wind</a>
      <a href="barometric_pressure_chart.html">Pressure</a>
    </nav>
    <div class="slide-container">
      <i class="fas fa-cloud-sun weather-icon"></i>
      <h1 class="title">Asheville Weather Analysis</h1>
      <h2 class="subtitle">A Comprehensive Look at Weather Patterns</h2>
      <p class="date">September 25-29, 2024</p>
    </div>
  </body>
</html>
